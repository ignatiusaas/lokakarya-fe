<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>
<app-navbar></app-navbar>
<div class="manage-technical-skill-container">
  <div class="manage-technical-skill-container">
    <h1 class="page-title">Manage Technical Skill</h1>
    <div class="header-actions">
      <div class="top-row">
        <div class="search-container">
          <span class="p-input-icon-left">
            <i class="pi pi-search"></i>
            <input
              (input)="onSearch()"
              [(ngModel)]="globalFilterValue"
              pInputText
              placeholder="Search..."
              type="text"
            />
          </span>
        </div>
        <button
          (click)="openCreateDialog()"
          [disabled]="isProcessing || isEditFormLoading"
          class="create-button"
          icon="pi pi-plus"
          label="Create"
          pButton
        ></button>
      </div>
    </div>

    <p-card>
      <p-table
        #dt
        (onLazyLoad)="fetchTechSkills($event)"
        [lazy]="true"
        [loading]="loading"
        [paginator]="true"
        [resizableColumns]="true"
        [rowsPerPageOptions]="[5, 10, 20]"
        [rows]="rowsPerPage"
        [sortMode]="'single'"
        [totalRecords]="totalRecords"
        [value]="techSkills"
        responsiveLayout="scroll"
      >
        <ng-template pTemplate="caption">
          <div class="table-filters">
            <div class="order-actions">
              <button
                (click)="toggleOrderDirection()"
                class="p-button-secondary toggle-order-button"
                icon="{{
                  selectedOrderDirection === 'asc'
                    ? 'pi pi-arrow-up'
                    : 'pi pi-arrow-down'
                }}"
                pButton
              ></button>
            </div>
          </div>
        </ng-template>
        <ng-template pTemplate="header">
          <tr>
            <th>Technical Skill</th>
            <th>Actions</th>
          </tr>
        </ng-template>
        <ng-template let-techSkill pTemplate="body">
          <tr [ngClass]="{ 'disabled-row': techSkill.enabled === false }">
            <td>{{ techSkill.technical_skill }}</td>
            <td>
              <button
                (click)="editTechSkill(techSkill.id)"
                [disabled]="isEditFormLoading || isProcessing"
                [icon]="
                  isEditFormLoading || isProcessing
                    ? 'pi pi-spin pi-spinner'
                    : 'pi pi-pencil'
                "
                class="p-button-rounded p-button-primary"
                pButton
              ></button>
              <button
                (click)="deleteTechSkill(techSkill.id)"
                [disabled]="isEditFormLoading || isProcessing"
                [icon]="
                  isEditFormLoading || isProcessing
                    ? 'pi pi-spin pi-spinner'
                    : 'pi pi-trash'
                "
                class="p-button-rounded p-button-danger"
                pButton
              ></button>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </p-card>

    <p-dialog
      [(visible)]="displayEditDialog"
      [closable]="true"
      [dismissableMask]="true"
      [modal]="true"
      [resizable]="false"
      [style]="{ width: '50vw' }"
      header="{{
        mode === 'create' ? 'Create Technical Skill' : 'Edit Technical Skill'
      }}"
    >
      <form (ngSubmit)="submitTechnicalSkill()" [formGroup]="editForm">
        <div class="p-fluid">
          <div *ngIf="mode === 'create'" class="p-field"></div>
          <div class="p-field">
            <label for="technical_skill"
            >Technical Skill
              <span class="required">*</span>
            </label>
            <div style="padding: 0.5rem 0">
              <input
                [disabled]="isProcessing"
                formControlName="technical_skill"
                id="technical_skill"
                pInputText
              />
            </div>
          </div>

          <div *ngIf="mode === 'edit'" class="p-field">
            <label for="enabled">Enabled Status</label>
            <div style="padding: 0, 5rem 0">
              <p-inputSwitch
                [disabled]="isProcessing"
                formControlName="enabled"
                id="enabled"
              ></p-inputSwitch>
            </div>
          </div>
        </div>
        <span class="required">*Required</span>
        <div class="dialog-footer">
          <button
            (click)="displayEditDialog = false"
            [disabled]="isProcessing"
            class="p-button-text"
            icon="pi pi-times"
            label="Cancel"
            pButton
            type="button"
          ></button>
          <button
            [disabled]="isProcessing"
            [label]="
              isProcessing
                ? mode === 'create'
                  ? 'Creating...'
                  : 'Saving...'
                : mode === 'create'
                ? 'Create'
                : 'Save'
            "
            class="p-button-primary"
            pButton
            type="submit"
          >
            <ng-container *ngIf="isProcessing">
              <i class="pi pi-spin pi-spinner"></i>
            </ng-container>
          </button>
        </div>
      </form>
    </p-dialog>
  </div>
</div>
