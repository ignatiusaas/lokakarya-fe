<nav class="navbar">
  <ul class="navbar-menu">
    <!-- Home Button -->
    <li
      class="home-item"
      *ngIf="!isHomePage"
      [ngClass]="{ active: isActiveRoute('home') }"
      (click)="navigateTo('home')"
    >
      Home
    </li>

    <!-- Manage Dropdown -->
    <li
      class="dropdown"
      [ngClass]="{ 'dropdown-open': activeDropdown === 'manage' }"
    >
      <span class="dropdown-button" (click)="toggleDropdown('manage')">
        Manage
        <span class="dropdown-icon">▼</span>
      </span>
      <ul class="dropdown-content">
        <li
          *ngFor="let menu of manageMenus"
          [ngClass]="{ active: isActiveRoute(menu) }"
          (click)="navigateTo(menu)"
        >
          {{ formatMenuName(menu) }}
        </li>
      </ul>
    </li>

    <!-- Assessment Dropdown -->
    <li
      class="dropdown"
      [ngClass]="{ 'dropdown-open': activeDropdown === 'assessment' }"
    >
      <span class="dropdown-button" (click)="toggleDropdown('assessment')">
        Assessment
        <span class="dropdown-icon">▼</span>
      </span>
      <ul class="dropdown-content">
        <li
          *ngIf="
            roles.includes('HR') ||
            roles.includes('SVP') ||
            roles.includes('MGR')
          "
          [ngClass]="{ active: isActiveRoute('view-assessment-summary') }"
          (click)="navigateTo('view-assessment-summary')"
        >
          Summary
        </li>

        <li
          *ngIf="
            !(
              roles.includes('HR') ||
              roles.includes('SVP') ||
              roles.includes('MGR')
            )
          "
          [ngClass]="{ active: isActiveRoute('assessment-summary') }"
          (click)="navigateTo('assessment-summary')"
        >
          Summary
        </li>

        <li
          *ngFor="let menu of submitMenus"
          [ngClass]="{ active: isActiveRoute(menu) }"
          (click)="navigateTo(menu)"
        >
          {{ formatMenuName(menu) }}
        </li>
      </ul>
    </li>

    <li class="user-info">
      <span class="user-name">{{ userName }}</span>
      <span class="user-roles">
        <span *ngFor="let role of roles">
          {{ role }}
          <span *ngIf="role !== roles[roles.length - 1]">•</span>
        </span>
      </span>
    </li>

    <li class="logout-item">
      <button class="logout-button" (click)="logout()" aria-label="Logout">
        Logout
      </button>
    </li>
  </ul>
</nav>
